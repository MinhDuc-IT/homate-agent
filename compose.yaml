name: homate
services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "homate/health", "-m", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  device-simulator:
    build: ./apps/device-simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_SIMULATED_DEVICE_IDS: ${MQTT_SIMULATED_DEVICE_IDS:-light-living}
    volumes: ["mqtt_device_data:/data"]
    ports: ["127.0.0.1:${DEVICE_SIMULATOR_PORT:-9040}:9040"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9040/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      mqtt:
        condition: service_healthy
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homate}
      POSTGRES_USER: ${POSTGRES_USER:-homate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homate_local}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55433}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-homate}:${POSTGRES_PASSWORD:-homate_local}@db:5432/${POSTGRES_DB:-homate}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-homate-development-change-this-secret-before-production}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_COMMAND_TIMEOUT_SECONDS: ${MQTT_COMMAND_TIMEOUT_SECONDS:-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
  ai-service:
    build: ./apps/ai-service
    environment:
      BACKEND_URL: http://backend:8000
      RAG_URL: http://rag-service:9030
      STT_URL: http://speech-service:9020
      TTS_URL: http://speech-service:9020
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_NAME: ${OPENROUTER_MODEL_NAME:-openai/gpt-4o-mini}
    ports: ["127.0.0.1:8010:8010"]
    depends_on: [backend, speech-service, rag-service]
  rag-migrate:
    image: homate-rag-service
    build: ./apps/rag-service
    command: ["python", "-m", "homate_rag.indexing.migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homate}:${POSTGRES_PASSWORD:-homate_local}@db:5432/${POSTGRES_DB:-homate}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-homate_rag_local}
    depends_on:
      backend:
        condition: service_healthy
  rag-service:
    image: homate-rag-service
    build: ./apps/rag-service
    environment:
      RAG_DATABASE_URL: postgresql://homate_rag:${RAG_DB_PASSWORD:-homate_rag_local}@db:5432/${POSTGRES_DB:-homate}
      BACKEND_URL: http://backend:8000
      KNOWLEDGE_DIRECTORY: /data/knowledge
      MODEL_CACHE: /models
    volumes: ["knowledge_files:/data/knowledge"]
    ports: ["127.0.0.1:9030:9030"]
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
  speech-service:
    build: ./apps/speech-service
    ports: ["127.0.0.1:9020:9020"]
  web:
    build: ./apps/web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend, ai-service, rag-service]
volumes:
  postgres_data:
  knowledge_files:
  mqtt_data:
  mqtt_device_data:
