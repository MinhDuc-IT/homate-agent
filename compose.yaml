name: homate
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homate}
      POSTGRES_USER: ${POSTGRES_USER:-homate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homate_local}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55433}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-homate}:${POSTGRES_PASSWORD:-homate_local}@db:5432/${POSTGRES_DB:-homate}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-homate-development-change-this-secret-before-production}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  ai-service:
    build: ./apps/ai-service
    environment:
      BACKEND_URL: http://backend:8000
      STT_URL: http://speech-service:9020
      TTS_URL: http://speech-service:9020
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_NAME: ${OPENROUTER_MODEL_NAME:-openai/gpt-4o-mini}
    ports: ["127.0.0.1:8010:8010"]
    depends_on: [backend, speech-service]
  speech-service:
    build: ./apps/speech-service
    ports: ["127.0.0.1:9020:9020"]
  web:
    build: ./apps/web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend, ai-service]
volumes:
  postgres_data:
