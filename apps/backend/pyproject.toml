[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homate-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "tzdata>=2024.1", "pydantic-settings>=2.5,<3", "PyJWT>=2.9,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
